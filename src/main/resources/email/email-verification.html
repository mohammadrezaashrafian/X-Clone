<!DOCTYPE html>
<html lang="en">
<body style="font-family: Arial, Helvetica, sans-serif; background: #f4f4f6; margin: 0; padding: 24px;">
  <div style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px;">
    <h2 style="margin-top: 0; color: #111;">Verify your email — {appName}</h2>
    <p style="color: #333;">Please confirm that <strong>{email}</strong> belongs to you.</p>
    <p style="color: #333;">Your verification code is:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #1d4ed8; text-align: center; margin: 16px 0;">
      {code}
    </p>
    <p style="color: #333;">This code expires in <strong>{expiresInMinutes} minutes</strong>.</p>
    <p style="color: #666; font-size: 13px;">If you did not request this code, you can safely ignore this email.</p>
  </div>
</body>
</html>
